<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fairfax Resource Navigator</title>
    <meta http-equiv="refresh" content="0; url=./frontend/index.html" />
    <style>
      :root {
        color-scheme: light;
        --ink: #17212b;
        --muted: #5d6874;
        --line: #d9e1e8;
        --civic: #071f2c;
        --wash: #f4f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--wash);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(560px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 28px;
        text-align: center;
      }

      img {
        width: 76px;
        height: 76px;
      }

      h1 {
        margin: 14px 0 8px;
        color: var(--civic);
        font-size: 26px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      a {
        display: inline-block;
        margin-top: 18px;
        border-radius: 8px;
        background: var(--civic);
        color: #ffffff;
        padding: 12px 16px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./frontend/assets/fairfax-seal.svg" alt="Fairfax County Virginia seal" />
      <h1>Opening Fairfax Resource Navigator</h1>
      <p>The full demo is loading from the resident-facing app view.</p>
      <a href="./frontend/index.html">Open Demo</a>
    </main>
    <script>
      window.location.replace('./frontend/index.html');
    </script>
  </body>
</html>
